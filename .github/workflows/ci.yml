name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # official v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean install
        run: npm ci
      - name: CI policy regression tests
        run: node --test scripts/ci-policy.test.mjs
      - name: Repository and migration contracts
        run: node scripts/ci-checks.mjs
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full advisory exception verification
        run: node scripts/ci-audit.mjs
      - name: Generate route types and typecheck
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-offline.mjs
        run: |
          node node_modules/next/dist/bin/next typegen
          node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Lint
        run: npm run lint
      - name: Full Vitest suite (offline)
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-offline.mjs
        run: npm run test:run
      - name: Production build (offline, no credentials)
        env:
          BACKEND_PROVIDER: supabase
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-offline.mjs
        run: npm run build
      - name: Lockfile and tracked-source stability
        run: git diff --exit-code
