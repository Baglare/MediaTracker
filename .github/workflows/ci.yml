name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # official v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean install
        run: npm ci
      - name: CI policy regression tests
        run: node --test scripts/ci-policy.test.mjs
      - name: Repository and migration contracts
        run: node scripts/ci-checks.mjs
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full advisory exception verification
        run: node scripts/ci-audit.mjs
      - name: Generate route types and typecheck
        env:
          BACKEND_PROVIDER: supabase
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-offline.mjs
        run: |
          node node_modules/next/dist/bin/next typegen
          node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Lint
        run: npm run lint
      - name: Full Vitest suite (offline)
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-offline.mjs
        run: npm run test:run
      - name: Production build (offline, no credentials)
        env:
          BACKEND_PROVIDER: supabase
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-offline.mjs
        run: npm run build
      - name: Lockfile and tracked-source stability
        run: git diff --exit-code

  native-linux-artifact:
    name: Experimental native Linux artifact
    needs: [validate, native-postgres-disposable-proof]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v1-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # official v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean install
        run: npm ci
      - name: Refuse inherited application configuration
        run: node scripts/ci-checks.mjs --environment-only
      - name: Artifact safety regression tests
        run: node --test scripts/native-artifact-check.test.mjs
      - name: Native production build and P3 package (offline, synthetic only)
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-offline.mjs
          BACKEND_PROVIDER: native
          DATABASE_URL: postgresql://mt_runtime:synthetic-build-only@127.0.0.1:1/mt_build
          DATABASE_SSL_MODE: verify-full
          BETTER_AUTH_URL: https://mediatracker.baglare.com.tr
          NEXT_PUBLIC_APP_URL: https://mediatracker.baglare.com.tr
          BETTER_AUTH_SECRET: synthetic-build-auth-aaaaaaaaaaaaaaaaaaaaaaaa
          NATIVE_SMTP_HOST: smtp.example.invalid
          NATIVE_SMTP_PORT: '465'
          NATIVE_SMTP_SECURITY: tls
          NATIVE_SMTP_USER: synthetic-build-only
          NATIVE_SMTP_PASSWORD: synthetic-build-mail-dddddddddddddddddddddd
          NATIVE_SMTP_FROM: auth@example.invalid
          RATE_LIMIT_IDENTITY_HMAC_KEY: synthetic-build-identity-bbbbbbbbbbbbbbbbbbbb
          RATE_LIMIT_RPC_SIGNING_KEY: synthetic-build-signing-cccccccccccccccccccc
          RATE_LIMIT_RPC_KEY_VERSION: v1
          RATE_LIMIT_RPC_AUDIENCE: mt-native-build
          NATIVE_STORAGE_ROOT: /tmp/mediatracker-native-build-data
          TRUSTED_INGRESS_MODE: unconfigured
          NEXT_PUBLIC_NATIVE_SIGNUP_ENABLED: 'true'
          NEXT_PUBLIC_CLOUD_MEDIA_SCHEMA_STAGE: d2c1
          NEXT_PUBLIC_CLOUD_MEDIA_V2_ENABLED: 'true'
          NEXT_PUBLIC_CLOUD_GOALS_SCHEMA_STAGE: v1
          NEXT_PUBLIC_CLOUD_GOALS_V1_ENABLED: 'true'
          NEXT_PUBLIC_CLOUD_MEDIA_MAINTENANCE: 'false'
          NEXT_PUBLIC_CLOUD_MEDIA_MINIMUM_CLIENT_VERSION: d2c2
          AI_SERVER_ACCESS_MODE: disabled
          D7_RESEARCH_ROLLOUT_MODE: disabled
          D7_RESEARCH_SHADOW_ENABLED: '0'
          D7_RESEARCH_PUBLIC_CITATIONS_ENABLED: '0'
          D7_RESEARCH_EVIDENCE_CACHE_ENABLED: '0'
          MEDIA_TRACKER_PERSISTENT_EMBEDDING_CACHE: off
        run: |
          export NEXT_PUBLIC_CLOUD_MEDIA_DEPLOYMENT_EPOCH="v1-${GITHUB_SHA:0:12}"
          node --input-type=module -e "import {validateReleaseEnvironment} from './scripts/ops/release-policy.mjs'; const env=Object.fromEntries(Object.entries(process.env).filter(([key])=>/^(BACKEND_PROVIDER|NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_NATIVE_SIGNUP_ENABLED|NATIVE_STORAGE_ROOT|TRUSTED_INGRESS_MODE|AI_SERVER_ACCESS_MODE|MEDIA_TRACKER_PERSISTENT_EMBEDDING_CACHE)$|^(DATABASE_|BETTER_AUTH_|NATIVE_SMTP_|RATE_LIMIT_|D7_RESEARCH_|NEXT_PUBLIC_CLOUD_)/.test(key))); if(!validateReleaseEnvironment(env,'PRODUCTION').valid) throw new Error('synthetic_build_contract_invalid');"
          npm run build
          node --test scripts/cloud-build-contract.test.mjs
          node scripts/cloud-build-contract.mjs .next "$GITHUB_SHA"
          package="dist/native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/native-package.mjs create "$package"
          node scripts/native-package.mjs verify "$package"
          node scripts/native-artifact-check.mjs "$package" "dist/native-abi.json"
          node scripts/native-release-artifact.mjs "$package" "$GITHUB_SHA"
      - name: Archive verified directory including hidden output
        id: archive
        run: |
          name="mediatracker-native-linux-${GITHUB_SHA:0:12}"
          package="dist/native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "dist/$name.tar.gz" -C "$package" .
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          (cd dist && sha256sum -c "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          git diff --exit-code
      - name: Upload experimental artifact (no deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4.6.2
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            dist/${{ steps.archive.outputs.name }}.tar.gz
            dist/${{ steps.archive.outputs.name }}.tar.gz.sha256
            dist/native-abi.json
          if-no-files-found: error
          retention-days: 7

  native-postgres-disposable-proof:
    name: Disposable native PostgreSQL P1/P2 proof
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v1-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # official v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean install
        run: npm ci
      - name: Refuse inherited application configuration
        run: node scripts/ci-checks.mjs --environment-only
      - name: Verify local Linux Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          for key in $(compgen -e); do
            case "$key" in
              DOCKER_*|NODE_OPTIONS|NATIVE_P1_PROOF_*) echo 'Inherited Docker/proof configuration denied'; exit 1 ;;
            esac
          done
          test -S /var/run/docker.sock
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test "$(docker --host unix:///var/run/docker.sock info --format '{{.OSType}}')" = linux
      - name: Prepare local PostgreSQL image before disposable tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s docker --host unix:///var/run/docker.sock pull postgres:18-alpine
          docker --host unix:///var/run/docker.sock image inspect postgres:18-alpine --format '{{.Id}}'
      - name: PG18 fresh upgrade concurrency and source-bound recovery
        run: node scripts/native-release-receipt.mjs
      - name: Independent receipt fingerprint verification
        run: node scripts/native-release-receipt.mjs --verify
      - name: Guest HMAC and session spoofing negative tests (offline adapter)
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-offline.mjs
        run: node node_modules/vitest/vitest.mjs run tests/native-tvmaze-guest-pool.test.ts tests/native-api-session-rate-limit.test.ts --maxWorkers=1
      - name: Upload validated synthetic receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4.6.2
        with:
          name: pg18-release-proof-${{ github.sha }}
          path: |
            dist/release-proof/release.json
            dist/release-proof/recovery.json
          if-no-files-found: error
          retention-days: 7
